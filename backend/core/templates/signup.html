{% load i18n %}<!doctype html>
<html lang="{{ LANGUAGE_CODE }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% trans "Create your account" %}</title>
</head>
<body>
  <h1>{% trans "Create your account" %}</h1>
  {% if sent %}
    <p role="status">{% trans "If this address can be registered, we have sent a link to confirm it and choose a password." %}</p>
  {% else %}
    {% if error %}<p role="alert">{{ error }}</p>{% endif %}
    <form method="post">
      {% csrf_token %}
      <p><label>{% trans "Email address" %} <input type="email" name="email" value="{{ email }}" autocomplete="username" required></label></p>
      <p><label>{% trans "Company name" %} <input type="text" name="company_name" value="{{ company_name }}" maxlength="200" autocomplete="organization" required></label></p>
      <button type="submit">{% trans "Continue" %}</button>
    </form>
  {% endif %}
</body>
</html>
